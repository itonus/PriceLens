name: PriceLens
options:
  bundleIdPrefix: com.itonus
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.8.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_CFBundleDisplayName: PriceLens
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSCameraUsageDescription: "PriceLens uses the camera to recognize product barcodes, labels, and prices for comparison."
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  PriceLens:
    type: application
    platform: iOS
    sources:
      - path: PriceLens
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itonus.PriceLens

  PriceLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PriceLensTests
      - path: TestFixtures
        buildPhase: resources
    dependencies:
      - target: PriceLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itonus.PriceLensTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PriceLens.app/PriceLens
        BUNDLE_LOADER: $(TEST_HOST)

  PriceLensUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PriceLensUITests
    dependencies:
      - target: PriceLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itonus.PriceLensUITests

schemes:
  PriceLens:
    build:
      targets:
        PriceLens: all
        PriceLensTests: [test]
        PriceLensUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PriceLensTests
        - PriceLensUITests
    archive:
      config: Release
